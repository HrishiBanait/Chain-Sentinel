<!doctype html>
<meta charset="utf-8">
<title>BridgeKey probe</title>
<style>
body{font:14px system-ui;margin:20px;max-width:960px}
button{margin:4px 4px 4px 0;padding:6px 10px}
input{width:420px}
pre{background:#111;color:#0f0;padding:10px;min-height:320px;white-space:pre-wrap;word-break:break-all}
</style>
<h2>BridgeKey wallet probe (MST Testnet only)</h2>
<p>Run the buttons in order. Check the network and account in the wallet popup before approving anything.</p>
<div>
  <button id="btnDetect">1 Detect providers</button>
  <button id="btnConnect">2 Connect</button>
  <button id="btnChain">3 Read chain id</button>
  <button id="btnSwitch">4 Switch to MST Testnet</button>
  <button id="btnCall">5 Read targetCount</button>
</div>
<div>
  target <input id="target" value="0x000000000000000000000000000000000000dEaD">
  threshold (raw) <input id="thr" value="0" style="width:100px"><br>
  <button id="btnSendA">6A registerTarget (wallet chooses fees)</button>
  <button id="btnSendB">6B registerTarget (explicit legacy 2 gwei)</button>
  <button id="btnCopy">Copy log</button>
</div>
<pre id="log"></pre>
<script>
var REGISTRY = "0xc9f3d85de752a4112c6399c2bb6eb7f06697d945";
var SEL_REGISTER = "0x9eb87c81";
var SEL_COUNT = "0xb01285cd";
var CHAIN_ID = 91562037;
var CHAIN_HEX = "0x" + CHAIN_ID.toString(16);
var logEl = document.getElementById("log");
var announced = [];
var chosen = null;
var account = null;

function log(m) { logEl.textContent += new Date().toISOString().slice(11, 19) + "  " + m + "\n"; }
function show(v) { try { return JSON.stringify(v); } catch (e) { return String(v); } }
function errText(e) {
  return "ERROR code=" + (e && e.code) + " message=" + (e && e.message) + (e && e.data ? " data=" + show(e.data) : "");
}

window.addEventListener("eip6963:announceProvider", function (ev) {
  var d = ev.detail || {};
  var i = d.info || {};
  announced.push(d);
  log("EIP-6963 announced: name=" + i.name + " rdns=" + i.rdns);
});
window.dispatchEvent(new Event("eip6963:requestProvider"));

function pick() {
  for (var i = 0; i < announced.length; i++) {
    var info = announced[i].info || {};
    var tag = ((info.name || "") + " " + (info.rdns || "")).toLowerCase();
    if (tag.indexOf("bridge") >= 0) return { p: announced[i].provider, how: "EIP-6963 (" + info.name + ")" };
  }
  if (window.ethereum) return { p: window.ethereum, how: "window.ethereum" };
  return null;
}

function attach(p) {
  if (!p.on) { log("provider has no .on(); events not observable"); return; }
  p.on("accountsChanged", function (a) { log("EVENT accountsChanged " + show(a)); });
  p.on("chainChanged", function (c) { log("EVENT chainChanged " + show(c)); });
  p.on("disconnect", function (e) { log("EVENT disconnect " + show(e)); });
}

function req(method, params) {
  return Promise.resolve().then(function () {
    var s = pick();
    if (!s) throw new Error("no provider found");
    if (chosen !== s.p) { chosen = s.p; attach(chosen); log("using provider via " + s.how); }
    return chosen.request({ method: method, params: params || [] });
  });
}

function pad32(h) { var s = h; while (s.length < 64) s = "0" + s; return s; }
function buildData() {
  var t = document.getElementById("target").value.trim();
  if (t.length !== 42 || t.indexOf("0x") !== 0 || !/^[0-9a-fA-F]+$/.test(t.slice(2))) throw new Error("bad target address");
  var thr = BigInt(document.getElementById("thr").value.trim() || "0").toString(16);
  return SEL_REGISTER + pad32(t.slice(2).toLowerCase()) + pad32(thr);
}

document.getElementById("btnDetect").onclick = function () {
  window.dispatchEvent(new Event("eip6963:requestProvider"));
  var e = window.ethereum;
  log("window.ethereum present: " + !!e);
  if (e) {
    var flags = Object.keys(e).filter(function (k) { return k.indexOf("is") === 0 && typeof e[k] === "boolean"; });
    log("window.ethereum flags: " + show(flags.map(function (k) { return k + "=" + e[k]; })));
    log("window.ethereum.providers length: " + (e.providers ? e.providers.length : "n/a"));
  }
  log("window keys containing 'bridge': " + show(Object.keys(window).filter(function (k) { return k.toLowerCase().indexOf("bridge") >= 0; })));
  log("EIP-6963 providers announced so far: " + announced.length);
};

document.getElementById("btnConnect").onclick = function () {
  req("eth_requestAccounts").then(function (a) { account = a[0]; log("accounts: " + show(a)); }).catch(function (e) { log(errText(e)); });
};

document.getElementById("btnChain").onclick = function () {
  req("eth_chainId").then(function (id) {
    log("eth_chainId = " + id + " (decimal " + parseInt(id, 16) + "), expected " + CHAIN_HEX);
  }).catch(function (e) { log(errText(e)); });
};

document.getElementById("btnSwitch").onclick = function () {
  req("wallet_switchEthereumChain", [{ chainId: CHAIN_HEX }]).then(function () {
    log("wallet_switchEthereumChain: ok");
  }).catch(function (e) {
    log("switch failed: " + errText(e));
    if (e && e.code === 4001) return;
    log("trying wallet_addEthereumChain");
    return req("wallet_addEthereumChain", [{
      chainId: CHAIN_HEX,
      chainName: "MST Testnet",
      nativeCurrency: { name: "tMSTC", symbol: "tMSTC", decimals: 18 },
      rpcUrls: ["https://testnetrpc.mstblockchain.com"],
      blockExplorerUrls: ["https://testnet.mstscan.com"]
    }]).then(function () { log("wallet_addEthereumChain: ok"); }).catch(function (e2) { log("add failed: " + errText(e2)); });
  });
};

document.getElementById("btnCall").onclick = function () {
  req("eth_call", [{ to: REGISTRY, data: SEL_COUNT }, "latest"]).then(function (r) {
    log("targetCount raw = " + r + " (decimal " + (r && r !== "0x" ? parseInt(r, 16) : "n/a, no contract at this address on the wallet's network") + "); expected 2 before the send, 3 after");
  }).catch(function (e) { log(errText(e)); });
};

function send(explicitGas) {
  var data;
  try { data = buildData(); } catch (e) { log("ERROR " + e.message); return; }
  var ensure = account ? Promise.resolve() : req("eth_accounts").then(function (a) { account = a[0]; });
  ensure.then(function () {
    if (!account) throw new Error("no connected account; press Connect first");
    var tx = { from: account, to: REGISTRY, data: data, value: "0x0" };
    if (explicitGas) tx.gasPrice = "0x" + (2000000000).toString(16);
    log("sending " + show(tx));
    return req("eth_sendTransaction", [tx]);
  }).then(function (hash) {
    log("tx hash: " + hash);
    var tries = 0;
    (function poll() {
      req("eth_getTransactionReceipt", [hash]).then(function (r) {
        if (r) { log("receipt: status=" + r.status + " block=" + r.blockNumber + " gasUsed=" + r.gasUsed + " effectiveGasPrice=" + r.effectiveGasPrice + " type=" + r.type); return; }
        if (++tries < 20) setTimeout(poll, 3000); else log("no receipt after 60 s");
      }).catch(function (e) { log("receipt error: " + errText(e)); });
    })();
  }).catch(function (e) { log(errText(e)); });
}
document.getElementById("btnSendA").onclick = function () { send(false); };
document.getElementById("btnSendB").onclick = function () { send(true); };
document.getElementById("btnCopy").onclick = function () { navigator.clipboard.writeText(logEl.textContent).then(function () { log("log copied"); }); };
</script>
